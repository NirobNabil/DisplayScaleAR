<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR Display Size Visualizer</title>
  <meta name="description" content="Point your phone's camera at a desk or wall and see a true-to-scale outline of any monitor or TV size, in augmented reality." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AR Display Size Visualizer" />
  <meta property="og:description" content="Point your phone's camera at a desk or wall and see a true-to-scale outline of any monitor or TV size, in augmented reality." />
  <meta property="og:url" content="https://nirobnabil.github.io/DisplayScaleAR/" />
  <meta property="og:image" content="https://nirobnabil.github.io/DisplayScaleAR/demo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://nirobnabil.github.io/DisplayScaleAR/demo.png" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #hint {
      position: fixed; top: 12%; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 8px;
      font-size: 14px; pointer-events: none;
    }
    #overlay {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.6); align-items: center;
    }
    #overlay[hidden] { display: none; }
    #overlay select { flex: 1 1 100%; font-size: 16px; padding: 8px; }
    #overlay button { font-size: 16px; padding: 8px 16px; }
    #axis-controls { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    #axis-controls[hidden] { display: none; }
    #axis-controls .row { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    #axis-controls button { flex: 1 1 auto; font-size: 13px; padding: 8px 4px; touch-action: none; user-select: none; }
    #unsupported {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #111; color: #fff; padding: 24px; text-align: center; font-size: 16px;
    }
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #111; z-index: 5;
    }
    #start button { font-size: 20px; padding: 16px 32px; }
  </style>
</head>
<body>
  <div id="start"><button id="start-ar">Start AR</button></div>
  <div id="unsupported">
    Your browser/device doesn't support WebXR AR (needs Chrome for Android on an ARCore-capable phone).
  </div>
  <div id="hint" hidden>Tap a detected surface to place</div>
  <div id="overlay" hidden>
    <select id="preset"></select>
    <div id="axis-controls" hidden>
      <div class="row">
        <button class="nudge" data-kind="t" data-axis="x" data-dir="-1">◀ X</button>
        <button class="nudge" data-kind="t" data-axis="x" data-dir="1">X ▶</button>
        <button class="nudge" data-kind="t" data-axis="y" data-dir="1">▲ Y</button>
        <button class="nudge" data-kind="t" data-axis="y" data-dir="-1">Y ▼</button>
        <button class="nudge" data-kind="t" data-axis="z" data-dir="1">Near</button>
        <button class="nudge" data-kind="t" data-axis="z" data-dir="-1">Far</button>
      </div>
      <div class="row">
        <button class="nudge" data-kind="r" data-axis="pitch" data-dir="-1">Pitch −</button>
        <button class="nudge" data-kind="r" data-axis="pitch" data-dir="1">Pitch +</button>
        <button class="nudge" data-kind="r" data-axis="yaw" data-dir="-1">Yaw −</button>
        <button class="nudge" data-kind="r" data-axis="yaw" data-dir="1">Yaw +</button>
        <button class="nudge" data-kind="r" data-axis="roll" data-dir="-1">Roll −</button>
        <button class="nudge" data-kind="r" data-axis="roll" data-dir="1">Roll +</button>
      </div>
      <div class="row">
        <button id="change-surface">Change Surface</button>
      </div>
    </div>
    <button id="reset">Reset</button>
  </div>

  <script src="presets.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
